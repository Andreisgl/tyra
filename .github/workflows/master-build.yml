name: Official build

on:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build the toolchain image
      run: |
        docker build -t tyra .

    - name: Compile engine
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C engine

    - name: Compile tutorials
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/01-hello
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/02-sprite
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/03-minecraft
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/04-de_dust2
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/05-animation
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/06-audio
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/07-lighting
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/08-skybox-debug
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/09-manual-mode
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C tutorials/10-sprite-sheet

    - name: Compile demo
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/tyra" -w /tyra tyra make clean all -C demo

    - name: Upload tutorials
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: tutorials-elf
        path: | 
          tutorials/01-hello/bin
          tutorials/02-sprite/bin
          tutorials/03-minecraft/bin
          tutorials/04-de_dust2/bin
          tutorials/05-animation/bin
          tutorials/06-audio/bin
          tutorials/07-lighting/bin
          tutorials/08-skybox-debug/bin
          tutorials/09-manual-mode/bin
          tutorials/10-sprite-sheet/bin

    - name: Upload demo
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: demo-elf
        path: | 
          demo/bin